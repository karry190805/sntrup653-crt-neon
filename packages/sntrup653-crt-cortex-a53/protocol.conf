export POLYMUL_ROUNDS=100 POLYMUL_LOOPS=2000 POLYMUL_HASH_TESTS=1000 POLYMUL_WARMUP=200
export KEM_ROUNDS=1000 KEM_WARMUP=100 BASE_SEED=20260901
